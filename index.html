<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Vis v0.2.3</title><style>

<script>
// ============================================================
// GLOBAL STATE
// ============================================================
var S = {
  tasks:   [],
  groups:  [],
  tags:    [],
  coins:   0,
  tab:     'main',
  selDate: null,
  calMon:  new Date(),
  calView: 'day'
};

var _completedFilter = 'selected';
var _filterDateFrom  = null;
var _filterDateTo    = null;

var _ovBundleCollapsed = {};

var _stmSnapshot  = null;
var _stmGroups    = [];
var _stmTags      = [];
var _stmUndo      = [];
var _stmRedo      = [];
var _stmSecOpen   = { groups: false, tags: false, appearance: false };
var _stmEditGrpId = null;

// ============================================================
// CONFIG
// ============================================================
var GC  = ['#378ADD','#22C55E','#F59E0B','#EF4444','#8B5CF6','#EC4899','#14B8A6','#F97316','#64748B'];
var DF  = {
  easy:    { lbl:'Easy',    c:1, cls:'de' },
  medium:  { lbl:'Medium',  c:2, cls:'dm' },
  hard:    { lbl:'Hard',    c:3, cls:'dh' },
  extreme: { lbl:'Extreme', c:4, cls:'dx' }
};
var STATUS_LABEL = { 'not-started':'Not Started', 'in-progress':'In Progress', 'completed':'Completed' };
var STATUS_CLS   = { 'not-started':'spl-ns',      'in-progress':'spl-ip',      'completed':'spl-c'     };

// ============================================================
// UTILITIES
// ============================================================
function uid()  { return Date.now().toString(36) + Math.random().toString(36).substr(2,5); }
function tod()  {
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function pad2(n){ return n < 10 ? '0'+n : ''+n; }
function fD(s)  {
  if (!s) return '';
  var d = new Date(s + 'T12:00:00');
  return d.toLocaleDateString('en-CA', { month:'short', day:'numeric' });
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function groupIdx(gid) {
  for (var i = 0; i < S.groups.length; i++) { if (S.groups[i].id === gid) return i; }
  return 9999;
}
function hexToRgb(hex) {
  return {
    r: parseInt(hex.slice(1,3), 16),
    g: parseInt(hex.slice(3,5), 16),
    b: parseInt(hex.slice(5,7), 16)
  };
}
function rgbToHex(r, g, b) {
  function h(n) { var s = Math.max(0,Math.min(255,Math.round(n))).toString(16); return s.length < 2 ? '0'+s : s; }
  return '#' + h(r) + h(g) + h(b);
}
function autoContrast(hex) {
  if (!hex || hex.length < 7) return '#0F172A';
  var r = parseInt(hex.slice(1,3),16) / 255;
  var g = parseInt(hex.slice(3,5),16) / 255;
  var b = parseInt(hex.slice(5,7),16) / 255;
  function lin(c) { return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4); }
  var L = 0.2126*lin(r) + 0.7152*lin(g) + 0.0722*lin(b);
  return L > 0.179 ? '#0F172A' : '#FFFFFF';
}

// ============================================================
// SCHEMA MIGRATION
// ============================================================
function migrateSchema() {
  S.tasks.forEach(function(t, i) {
    if (t.status === undefined) { t.status = t.done ? 'completed' : 'not-started'; }
    delete t.done;
    if (!t.type)                   t.type = 'solo';
    if (!t.parentId)               t.parentId = null;
    if (!t.tags)                   t.tags = [];
    if (!t.notes)                  t.notes = '';
    if (t.completedAt === undefined) t.completedAt = (t.status === 'completed' ? t.created : null);
    if (t.coinsAwarded === undefined) {
      t.coinsAwarded = 1 + (t.status === 'completed' ? (DF[t.difficulty] ? DF[t.difficulty].c : 0) : 0);
    }
    if (t.sortOrder === undefined) t.sortOrder = i;
    if (t.difficulty === undefined) t.difficulty = null;
  });
  S.groups.forEach(function(g) {
    if (g.deleted === undefined)  g.deleted = false;
    if (g._open   === undefined)  g._open   = true;
    delete g.priority;
    delete g.tags;
  });
}

// ============================================================
// PERSISTENCE
// ============================================================
function saveState() {
  var groupsToSave = S.groups.map(function(g) {
    return { id:g.id, name:g.name, color:g.color, deleted:g.deleted };
  });
  try {
    localStorage.setItem('vis_tasks',  JSON.stringify(S.tasks));
    localStorage.setItem('vis_groups', JSON.stringify(groupsToSave));
    localStorage.setItem('vis_tags',   JSON.stringify(S.tags));
  } catch(e) { console.warn('[Vis] saveState failed', e); }
}
function loadState() {
  try {
    var t  = localStorage.getItem('vis_tasks');
    var g  = localStorage.getItem('vis_groups');
    var tg = localStorage.getItem('vis_tags');
    if (t)  S.tasks  = JSON.parse(t);
    if (g)  S.groups = JSON.parse(g);
    if (tg) S.tags   = JSON.parse(tg);
  } catch(e) { console.warn('[Vis] State load failed', e); }
  S.groups.forEach(function(g) { if (g._open === undefined) g._open = true; });
  migrateSchema();
  recalculateCoins();
}

// ============================================================
// COIN LEDGER
// ============================================================
function recalculateCoins() {
  S.coins = S.tasks.reduce(function(sum, t) { return sum + (t.coinsAwarded || 0); }, 0);
  updateCoinDisplay();
}
function updateCoinDisplay() {
  var el    = document.getElementById('cc');
  var badge = document.querySelector('.cbadge');
  var dot   = document.querySelector('.cic');
  if (el)    el.textContent = S.coins;
  if (badge) badge.classList.toggle('cbadge-neg', S.coins < 0);
  if (dot)   dot.style.background = S.coins < 0 ? '#B91C1C' : '#378ADD';
}

// ============================================================
// SEED DEMO
// ============================================================
function seedDemo() {
  if (S.tasks.length > 0) return;
  var now = tod();
  var yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
  var yd = yesterday.getFullYear()+'-'+pad2(yesterday.getMonth()+1)+'-'+pad2(yesterday.getDate());
  S.groups = [
    { id:'g1', name:'University',  color:'#8B5CF6', deleted:false, _open:true },
    { id:'g2', name:'Work Sprint', color:'#3B82F6', deleted:false, _open:true }
  ];
  S.tags = ['Study','Biology','Work','Health','Fitness','Productivity'];
  S.tasks = [
    { id:'b1', type:'bundle',  title:'Assignment 2 \u2014 Cell Biology',
      difficulty:null, tags:['Study'], notes:'', created:now, completedAt:null,
      date:now, groupId:'g1', parentId:null, status:null, coinsAwarded:0, sortOrder:0 },
    { id:'s1', type:'subtask', title:'Read Chapter 5 \u2014 Mitosis',
      difficulty:'medium', tags:['Biology'], notes:'Focus on diagrams', created:now, completedAt:now,
      date:null, groupId:'g1', parentId:'b1', status:'completed', coinsAwarded:3, sortOrder:0 },
    { id:'s2', type:'subtask', title:'Write lab summary (500 words)',
      difficulty:'hard', tags:['Study'], notes:'', created:now, completedAt:null,
      date:null, groupId:'g1', parentId:'b1', status:'not-started', coinsAwarded:1, sortOrder:1 },
    { id:'d1', type:'solo', title:'Deep work session \u2014 project spec',
      difficulty:'extreme', tags:['Work'], notes:'Block 2 hours, no distractions', created:now, completedAt:null,
      date:now, groupId:'g2', parentId:null, status:'in-progress', coinsAwarded:1, sortOrder:0 },
    { id:'d2', type:'solo', title:'Review pull requests',
      difficulty:'medium', tags:['Work'], notes:'', created:yd, completedAt:null,
      date:yd, groupId:'g2', parentId:null, status:'not-started', coinsAwarded:1, sortOrder:1 },
    { id:'d3', type:'solo', title:'Morning run 5km',
      difficulty:'easy', tags:['Health','Fitness'], notes:'', created:now, completedAt:null,
      date:now, groupId:null, parentId:null, status:'not-started', coinsAwarded:1, sortOrder:0 }
  ];
  recalculateCoins();
  saveState();
}

// ============================================================
// TAG INPUT SYSTEM
// ============================================================
var _tagState  = {};
var _dropTimer = null;

function tagCtxInit(ctx, initial) {
  _tagState[ctx] = initial ? initial.slice() : [];
  renderTagPillsCtx(ctx);
}
function tagCtxGet(ctx) { return _tagState[ctx] || []; }

function renderTagPillsCtx(ctx) {
  var wrap = document.getElementById(ctx + '-taw');
  var inp  = document.getElementById(ctx + '-inp');
  if (!wrap || !inp) return;
  var pills = wrap.querySelectorAll('.tp');
  for (var i = 0; i < pills.length; i++) pills[i].remove();
  var arr = _tagState[ctx] || [];
  for (var j = 0; j < arr.length; j++) {
    (function(tag, idx) {
      var p = document.createElement('div');
      p.className = 'tp';
      var rm = document.createElement('span');
      rm.className = 'trm';
      rm.innerHTML = '&#215;';
      rm.onclick = function(e) {
        e.stopPropagation();
        _tagState[ctx].splice(idx, 1);
        renderTagPillsCtx(ctx);
      };
      p.textContent = tag;
      p.appendChild(rm);
      wrap.insertBefore(p, inp);
    })(arr[j], j);
  }
}

function addTagToCtx(ctx, val) {
  val = val.trim(); if (!val) return;
  if (!_tagState[ctx]) _tagState[ctx] = [];
  if (_tagState[ctx].indexOf(val) < 0) _tagState[ctx].push(val);
  if (S.tags.indexOf(val) < 0) { S.tags.push(val); saveState(); }
  renderTagPillsCtx(ctx);
  var inp = document.getElementById(ctx + '-inp');
  if (inp) inp.value = '';
  hideTagDrop(ctx);
}

function renderTagDrop(ctx) {
  var inp  = document.getElementById(ctx + '-inp');
  var drop = document.getElementById(ctx + '-drop');
  if (!inp || !drop) return;
  var v    = inp.value.trim().toLowerCase();
  var arr  = _tagState[ctx] || [];
  var opts = S.tags.filter(function(t) {
    return arr.indexOf(t) < 0 && (!v || t.toLowerCase().indexOf(v) >= 0);
  });
  drop.innerHTML = '';
  opts.forEach(function(t) {
    var d = document.createElement('div');
    d.className = 'tdi'; d.textContent = t;
    d.onmousedown = function(e) { e.preventDefault(); addTagToCtx(ctx, t); };
    drop.appendChild(d);
  });
  var vt = inp.value.trim();
  if (vt && S.tags.map(function(x){return x.toLowerCase();}).indexOf(vt.toLowerCase()) < 0) {
    var nd = document.createElement('div');
    nd.className = 'tdi new-tag'; nd.textContent = '+ Create "' + vt + '"';
    nd.onmousedown = function(e) { e.preventDefault(); addTagToCtx(ctx, vt); };
    drop.appendChild(nd);
  }
  drop.classList.toggle('on', drop.children.length > 0);
}

function tagKey(e, ctx) {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    var inp = document.getElementById(ctx + '-inp');
    if (inp && inp.value.trim()) addTagToCtx(ctx, inp.value.trim());
  }
  if (e.key === 'Escape') hideTagDrop(ctx);
}
function hideTagDrop(ctx) {
  var d = document.getElementById(ctx + '-drop');
  if (d) d.classList.remove('on');
}
function hideDropDelay(ctx) {
  clearTimeout(_dropTimer);
  _dropTimer = setTimeout(function() { hideTagDrop(ctx); }, 200);
}

// ============================================================
// DIFFICULTY PICKER
// ============================================================
var _diffState = {};
function pickDiff(mId, el) {
  _diffState[mId] = el.getAttribute('data-d');
  var row = el.parentElement;
  var dos = row.querySelectorAll('.do');
  for (var i = 0; i < dos.length; i++) dos[i].classList.remove('dsel');
  el.classList.add('dsel');
}
function getDiff(mId) { return _diffState[mId] || 'easy'; }
function setDiff(mId, d) {
  _diffState[mId] = d || 'easy';
  var rowId = mId + '-diff';
  if (mId === 'tm')  rowId = 'tm-diff';
  if (mId === 'asm') rowId = 'asm-diff';
  var row = document.getElementById(rowId);
  if (!row) return;
  var dos = row.querySelectorAll('.do');

// ============================================================
function buildColorPicker(initialColor, onChangeFn) {
  var currentColor = (initialColor || '#378ADD').toLowerCase();
  var wrap = document.createElement('div');

  var presetRow = document.createElement('div');
  presetRow.className = 'colrow';
  presetRow.style.marginBottom = '6px';

  var nativeInp = document.createElement('input');
  nativeInp.type = 'color';
  nativeInp.value = currentColor;
  nativeInp.style.cssText = 'width:100%;height:28px;border:0.5px solid var(--color-border-secondary);border-radius:4px;cursor:pointer;padding:1px 3px;background:none;font-family:var(--font-sans)';

  var hexInp = document.createElement('input');
  hexInp.type = 'text';
  hexInp.className = 'fi';
  hexInp.style.fontSize = '10px';
  hexInp.value = currentColor.toUpperCase();
  hexInp.placeholder = '#378ADD';
  hexInp.maxLength = 7;

  var rgb0 = hexToRgb(currentColor);
  var rInp = document.createElement('input'); rInp.type='number'; rInp.className='fi'; rInp.style.cssText='font-size:10px;width:100%'; rInp.min=0; rInp.max=255; rInp.value=rgb0.r;
  var gInp = document.createElement('input'); gInp.type='number'; gInp.className='fi'; gInp.style.cssText='font-size:10px;width:100%'; gInp.min=0; gInp.max=255; gInp.value=rgb0.g;
  var bInp = document.createElement('input'); bInp.type='number'; bInp.className='fi'; bInp.style.cssText='font-size:10px;width:100%'; bInp.min=0; bInp.max=255; bInp.value=rgb0.b;

  function syncFromHex(hex) {
    currentColor = hex.toLowerCase();
    nativeInp.value = currentColor;
    hexInp.value = currentColor.toUpperCase();
    var rgb2 = hexToRgb(currentColor);
    rInp.value = rgb2.r; gInp.value = rgb2.g; bInp.value = rgb2.b;
    var dots = presetRow.querySelectorAll('.cs');
    for (var i = 0; i < dots.length; i++) {
      dots[i].classList.toggle('on', dots[i].getAttribute('data-col') === currentColor);
    }
    onChangeFn(currentColor);
  }

  GC.forEach(function(col) {
    var cs = document.createElement('div'); cs.className = 'cs'; cs.style.background = col;
    cs.setAttribute('data-col', col.toLowerCase());
    if (col.toLowerCase() === currentColor) cs.classList.add('on');
    cs.onclick = function() { syncFromHex(col); };
    presetRow.appendChild(cs);
  });

  nativeInp.addEventListener('input', function() { syncFromHex(nativeInp.value); });
  hexInp.addEventListener('input', function() {
    var v = hexInp.value.trim();
    if (/^#[0-9A-Fa-f]{6}$/.test(v)) { syncFromHex(v); }
  });

  function clampRgbInput(inp) {
    var v = parseInt(inp.value, 10);
    if (isNaN(v)) v = 0;
    v = Math.max(0, Math.min(255, v));
    inp.value = v; return v;
  }
  function onRgbChange() {
    if (rInp.value === '' || gInp.value === '' || bInp.value === '') return;
    var r2 = clampRgbInput(rInp), g2 = clampRgbInput(gInp), b2 = clampRgbInput(bInp);
    syncFromHex(rgbToHex(r2, g2, b2));
  }
  rInp.addEventListener('input', onRgbChange);
  gInp.addEventListener('input', onRgbChange);
  bInp.addEventListener('input', onRgbChange);

  wrap.appendChild(presetRow);
  var div1 = document.createElement('hr'); div1.style.cssText='border:none;border-top:0.5px solid #E2E8F0;margin:5px 0'; wrap.appendChild(div1);

  var nLbl = document.createElement('label'); nLbl.className='fl'; nLbl.textContent='Custom';
  var nWrap = document.createElement('div'); nWrap.style.marginBottom='5px'; nWrap.appendChild(nLbl); nWrap.appendChild(nativeInp);
  wrap.appendChild(nWrap);

  var hLbl = document.createElement('label'); hLbl.className='fl'; hLbl.textContent='Hex';
  var hWrap = document.createElement('div'); hWrap.style.marginBottom='5px'; hWrap.appendChild(hLbl); hWrap.appendChild(hexInp);
  wrap.appendChild(hWrap);

  var rgbRow = document.createElement('div'); rgbRow.style.cssText='display:flex;gap:4px';
  function makeRgbField(lbl, inp) {
    var w = document.createElement('div'); w.style.flex='1';
    var l = document.createElement('label'); l.className='fl'; l.textContent=lbl;
    w.appendChild(l); w.appendChild(inp); return w;
  }
  rgbRow.appendChild(makeRgbField('R', rInp));
  rgbRow.appendChild(makeRgbField('G', gInp));
  rgbRow.appendChild(makeRgbField('B', bInp));
  wrap.appendChild(rgbRow);

  return wrap;
}

var _calPickerYear = new Date().getFullYear();

function renderCal() {
  var container = document.getElementById('cal-container');
  if (!container) return;
  container.innerHTML = '';
  if      (S.calView === 'month') renderCalMonth(container);
  else if (S.calView === 'year')  renderCalYear(container);
  else                             renderCalDay(container);
}

  var m  = S.calMon;
  var y  = m.getFullYear();
  var mo = m.getMonth();
  var hdr = document.createElement('div'); hdr.className = 'calh';

  lbl.textContent = m.toLocaleDateString('en-CA', { month:'long', year:'numeric' });
  lbl.title = 'Click to pick month';
  lbl.onclick = function() { _calPickerYear = y; S.calView = 'month'; renderCal(); };
  var prev = document.createElement('button'); prev.className = 'cnav'; prev.innerHTML = '&#8249;'; prev.onclick = function(){ chMon(-1); };
  var next = document.createElement('button'); next.className = 'cnav'; next.innerHTML = '&#8250;'; next.onclick = function(){ chMon(1); };

  });

// ============================================================
// OVERDUE — SHARED FILTER HELPER
// ============================================================
function getOverdueTasks() {
  var today = tod();
  return S.tasks.filter(function(t) {
    if (t.type !== 'solo' && t.type !== 'bundle') return false;
    if (!t.date || t.date >= today) return false;
    if (t.type === 'solo') return t.status !== 'completed';
    if (t.type === 'bundle') {
      var subs = S.tasks.filter(function(s) { return s.parentId === t.id; });
      if (subs.length === 0) return false;
      return !subs.every(function(s) { return s.status === 'completed'; });
    }
    return false;
  });
}

// ============================================================
// OVERDUE PANEL
// ============================================================
var _overdueOpen = false;

function renderOverdue() {
  var hdrEl    = document.getElementById('ov-panel-hdr');
  var hdrTxt   = document.getElementById('ov-hdr-txt');
  var outerEl  = document.getElementById('ov-panel-outer');
  var bodyEl   = document.getElementById('ov-panel-body');
  var listEl   = document.getElementById('ov-list');
  var emptyEl  = document.getElementById('ov-empty-txt');
  var toggleEl = document.getElementById('ov-toggle-icon');
  if (!hdrEl) return;

  var overdue = getOverdueTasks();
  var n = overdue.length;
  hdrTxt.textContent = 'OVERDUE (' + n + ')';

  if (n === 0) {
    hdrEl.classList.remove('active');
    outerEl.classList.remove('active');
    bodyEl.classList.add('collapsed');
    if (toggleEl) toggleEl.style.display = 'none';
    emptyEl.style.display = 'block';
    listEl.innerHTML = '';
    return;
  }

  hdrEl.classList.add('active');
  outerEl.classList.add('active');
  if (toggleEl) toggleEl.style.display = '';
  toggleEl.innerHTML = _overdueOpen ? '&#9650;' : '&#9660;';
  bodyEl.classList.toggle('collapsed', !_overdueOpen);
  emptyEl.style.display = 'none';
  listEl.innerHTML = '';

  var dateMap = {};
  overdue.forEach(function(t) {
    if (!dateMap[t.date]) dateMap[t.date] = [];
    dateMap[t.date].push(t);
  });

  var dates = Object.keys(dateMap).sort(function(a, b) { return a < b ? -1 : a > b ? 1 : 0; });

  dates.forEach(function(date) {
    var items = dateMap[date];
    var dateBox = document.createElement('div'); dateBox.className = 'ov-date-box';
    var dateBoxHdr = document.createElement('div'); dateBoxHdr.className = 'ov-date-box-hdr';
    dateBoxHdr.textContent = fD(date);
    dateBox.appendChild(dateBoxHdr);

    var groupedMap = {};
    var ungrouped  = [];
    items.forEach(function(t) {
      if (t.groupId) {
        if (!groupedMap[t.groupId]) groupedMap[t.groupId] = [];
        groupedMap[t.groupId].push(t);
      } else {
        ungrouped.push(t);
      }
    });

    var groupIds = Object.keys(groupedMap).sort(function(a, b) { return groupIdx(a) - groupIdx(b); });

    groupIds.forEach(function(gid) {
      var g = S.groups.find(function(x) { return x.id === gid; });
      var grpColor = g && !g.deleted ? g.color : '#CBD5E1';
      var grpName  = g ? (g.deleted ? 'Deleted' : g.name) : '';

      var pill = document.createElement('div');
      pill.className = 'ov-grp-pill';
      pill.style.background = grpColor;
      pill.style.color = autoContrast(grpColor);
      pill.textContent = grpName;
      dateBox.appendChild(pill);

      var gItems = groupedMap[gid].sort(function(a, b) { return (a.sortOrder||0) - (b.sortOrder||0); });
      gItems.forEach(function(t) { dateBox.appendChild(buildOvItem(t)); });
    });

    ungrouped.sort(function(a, b) { return (a.sortOrder||0) - (b.sortOrder||0); });
    ungrouped.forEach(function(t) { dateBox.appendChild(buildOvItem(t)); });

    listEl.appendChild(dateBox);
  });
}

function buildOvItem(t) {
  var grp = t.groupId ? S.groups.find(function(g) { return g.id === t.groupId; }) : null;
  var grpColor = grp && !grp.deleted ? grp.color : '#CBD5E1';

  if (t.type === 'bundle') {
    var isCollapsed = (_ovBundleCollapsed[t.id] !== false);
    var wrapper = document.createElement('div');

    var item = document.createElement('div'); item.className = 'ov-item ov-bundle-row';
    var arrowEl = document.createElement('span'); arrowEl.className = 'ov-bundle-arrow';
    arrowEl.textContent = isCollapsed ? '\u25BA' : '\u25BC';
    var dotEl = document.createElement('div'); dotEl.className = 'ov-gdot'; dotEl.style.background = grpColor;
    var titleEl = document.createElement('div'); titleEl.className = 'ov-item-title'; titleEl.textContent = t.title;

    var subs = S.tasks.filter(function(s) { return s.parentId === t.id; });
    var done = subs.filter(function(s) { return s.status === 'completed'; }).length;
    var progEl = document.createElement('div'); progEl.className = 'ov-progress';
    progEl.textContent = done + '/' + subs.length;

    item.appendChild(arrowEl); item.appendChild(dotEl); item.appendChild(titleEl); item.appendChild(progEl);
    item.onclick = (function(tid) { return function() {
      _ovBundleCollapsed[tid] = (_ovBundleCollapsed[tid] === false) ? true : false;
      renderOverdue();
    }; })(t.id);
    wrapper.appendChild(item);

    var subWrap = document.createElement('div'); subWrap.className = 'ov-sub-wrap';
    if (!isCollapsed) {
      subs.sort(function(a,b){ return (a.sortOrder||0)-(b.sortOrder||0); });
      subs.forEach(function(sub) {
        var subRow = document.createElement('div'); subRow.className = 'ov-sub-row';
        var ckEl = document.createElement('div');
        ckEl.className = 'ck' + (sub.status === 'completed' ? ' chk' : '');
        if (sub.status === 'completed') ckEl.innerHTML = '&#10003;';
        (function(sid, ck, subRef) {
          ck.onclick = function(e) {
            e.stopPropagation();
            setStatus(sid, subRef.status === 'completed' ? 'not-started' : 'completed', ck);
          };
        })(sub.id, ckEl, sub);
        var subTitle = document.createElement('div'); subTitle.className = 'ov-sub-title'; subTitle.textContent = sub.title;
        subRow.appendChild(ckEl); subRow.appendChild(subTitle);
        if (sub.difficulty && DF[sub.difficulty]) {
          var diffEl = document.createElement('span');
          diffEl.className = 'db ' + DF[sub.difficulty].cls;
          diffEl.textContent = DF[sub.difficulty].lbl;
          subRow.appendChild(diffEl);
        }
        subWrap.appendChild(subRow);
      });
    }
    wrapper.appendChild(subWrap);
    return wrapper;

  } else {
    var item2 = document.createElement('div'); item2.className = 'ov-item';
    var dotEl2 = document.createElement('div'); dotEl2.className = 'ov-gdot'; dotEl2.style.background = grpColor;
    var titleEl2 = document.createElement('div'); titleEl2.className = 'ov-item-title'; titleEl2.textContent = t.title;
    item2.appendChild(dotEl2); item2.appendChild(titleEl2);
    item2.onclick = (function(tid){ return function(){ clickOverdue(tid); }; })(t.id);
    return item2;
  }
}

function toggleOverduePanel() {
  if (getOverdueTasks().length === 0) return;
  _overdueOpen = !_overdueOpen;
  renderOverdue();
}

function clickOverdue(tid) {
  var t = S.tasks.find(function(x) { return x.id === tid; });
  if (!t) return;
  S.tab = 'main';
  S.selDate = t.date;
  if (t.date) {
    var parts = t.date.split('-');
    S.calMon = new Date(parseInt(parts[0]), parseInt(parts[1])-1, 1);
  }
  render(); renderCal(); renderOverdue();
  setTimeout(function() {
    var el = document.getElementById('task-'+tid) || document.getElementById('bundle-'+tid);
    if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
    if (t.type === 'bundle') openEditBundle(tid);
    else openEditTask(tid);
  }, 120);
}

// ============================================================
// CONTEXT MENU
// ============================================================
function openContextMenu(items, anchorEl) {
  var old = document.querySelector('.ctx-menu');
  if (old) old.remove();
  var sd = document.querySelector('.status-drop');
  if (sd) sd.remove();

  var menu = document.createElement('div');
  menu.className = 'ctx-menu';

  items.forEach(function(item) {
    if (item.divider) {
      var hr = document.createElement('hr'); hr.className = 'ctx-div'; menu.appendChild(hr); return;
    }
    var mi = document.createElement('div');
    mi.className = 'ctx-item' + (item.danger ? ' danger' : '');

    if (item.submenu && item.submenu.length) {
      var arr  = document.createElement('span'); arr.className = 'ctx-arrow'; arr.innerHTML = '&#9664;';
      var span = document.createElement('span'); span.textContent = item.label;
      mi.appendChild(arr); mi.appendChild(span);
      var sub = document.createElement('div'); sub.className = 'ctx-sub-wrap';
      item.submenu.forEach(function(si) {
        if (si.divider) { var hr2 = document.createElement('hr'); hr2.className = 'ctx-div'; sub.appendChild(hr2); return; }
        var smi = document.createElement('div');
        smi.className = 'ctx-sub-item' + (si.danger ? ' danger' : '');
        smi.textContent = si.label;
        smi.onclick = (function(action){ return function(e) {
          e.stopPropagation(); menu.remove(); if (action) action();
        }; })(si.action);
        sub.appendChild(smi);
      });
      mi.appendChild(sub);
    } else {
      mi.textContent = item.label;
      mi.onclick = (function(action){ return function(e) {
        e.stopPropagation(); menu.remove(); if (action) action();
      }; })(item.action);
    }
    menu.appendChild(mi);
  });

  var app = document.getElementById('va');
  var ar  = app.getBoundingClientRect();
  var er  = anchorEl.getBoundingClientRect();
  menu.style.position = 'absolute';
  var left = er.left - ar.left;
  var top  = er.bottom - ar.top;
  if (ar.bottom - er.bottom < 160) { top = er.top - ar.top - 8; menu.style.transform = 'translateY(-100%)'; }
  if (left + 160 > ar.width) left = Math.max(0, er.right - ar.left - 160);
  menu.style.left = left + 'px';
  menu.style.top  = top + 'px';
  app.appendChild(menu);

  var subWraps = menu.querySelectorAll('.ctx-sub-wrap');
  for (var si = 0; si < subWraps.length; si++) {
    var sw = subWraps[si];
    sw.style.display     = 'block';
    sw.style.visibility  = 'hidden';
    var swRect = sw.getBoundingClientRect();
    sw.style.display    = '';
    sw.style.visibility = '';
    if (swRect.left < ar.left) {
      sw.style.right = 'auto';
      sw.style.left  = '100%';
    }
  }

  function outsideClick(e) {
    if (!menu.contains(e.target)) { menu.remove(); cleanup(); }
  }
  function escKey(e) {
    if (e.key === 'Escape') { menu.remove(); cleanup(); }
  }
  function cleanup() {
    document.removeEventListener('mousedown', outsideClick);
    document.removeEventListener('keydown',   escKey);
  }
  setTimeout(function() {
    document.addEventListener('mousedown', outsideClick);
    document.addEventListener('keydown',   escKey);
  }, 0);
}

// ============================================================
// STATUS TRANSITIONS
// ============================================================
function setStatus(tid, newStatus, ckEl) {
  var t = S.tasks.find(function(x) { return x.id === tid; });
  if (!t || t.type === 'bundle') return;
  var prev = t.status;
  if (prev === newStatus) return;

  if (prev === 'completed') {
    t.coinsAwarded -= DF[t.difficulty] ? DF[t.difficulty].c : 0;
    t.completedAt   = null;
    if (t.parentId) {
      var bun = S.tasks.find(function(b) { return b.id === t.parentId; });
      if (bun && bun.completedAt !== null) { bun.coinsAwarded -= 1; bun.completedAt = null; }
    }
  }

  t.status = newStatus;

  if (newStatus === 'completed') {
    var diff = DF[t.difficulty] ? DF[t.difficulty].c : 0;
    t.coinsAwarded += diff;
    t.completedAt   = tod();
    var ck = ckEl || document.getElementById('ck-'+tid);
    if (ck) { triggerSpring(ck); cpop(ck, diff); }
    var bundleBonusAwarded = false;
    if (t.parentId) {
      var bundle2 = S.tasks.find(function(b) { return b.id === t.parentId; });
      if (bundle2) {
        var subs = S.tasks.filter(function(s) { return s.parentId === t.parentId; });
        if (subs.every(function(s) { return s.status === 'completed'; })) {
          bundle2.coinsAwarded += 1;
          bundle2.completedAt   = tod();
          bundleBonusAwarded = true;
        }
      }
    }
    recalculateCoins();
    saveState();
    if (bundleBonusAwarded) {
      onBundleComplete(t.parentId);
      renderOverdue();
    } else {
      render(); renderOverdue();
    }
    return;
  }

  recalculateCoins();
  saveState();
  render(); renderOverdue();
}

function onBundleComplete(bundleId) {
  var bEl = document.getElementById('bundle-'+bundleId);
  if (bEl) {
    var fill = bEl.querySelector('.progress-fill');
    if (fill) { fill.style.width = '100%'; fill.style.background = '#22C55E'; }
    setTimeout(function() {
      var sw = bEl.querySelector('.subtasks-wrap');
      if (sw) {
        var h = sw.offsetHeight;
        sw.style.maxHeight  = h + 'px';
        sw.style.overflow   = 'hidden';
        sw.style.transition = 'max-height 0.3s ease-out';
        setTimeout(function() {
          sw.style.maxHeight = '0';
          setTimeout(function() { render(); renderOverdue(); }, 350);
        }, 30);
      } else { render(); renderOverdue(); }
    }, 500);
  } else { render(); renderOverdue(); }
}

function openStatusDrop(tid, anchorEl) {
  var old = document.querySelector('.status-drop');
  if (old) { old.remove(); return; }
  var app  = document.getElementById('va');
  var ar   = app.getBoundingClientRect();
  var er   = anchorEl.getBoundingClientRect();
  var drop = document.createElement('div');
  drop.className = 'status-drop';
  drop.style.position = 'absolute';
  drop.style.left = (er.left - ar.left) + 'px';
  drop.style.top  = (er.bottom - ar.top + 2) + 'px';
  var opts = ['not-started','in-progress','completed'];
  opts.forEach(function(s) {
    var it = document.createElement('div'); it.className = 'status-drop-item'; it.textContent = STATUS_LABEL[s];
    it.onclick = function(e) { e.stopPropagation(); drop.remove(); setStatus(tid, s, null); };
    drop.appendChild(it);
  });
  app.appendChild(drop);
  function dismiss(e) { if (!drop.contains(e.target)) { drop.remove(); document.removeEventListener('mousedown', dismiss); } }
  setTimeout(function() { document.addEventListener('mousedown', dismiss); }, 0);
}

// ============================================================
// ANIMATIONS
// ============================================================
function triggerSpring(el) {
  if (!el) return;
  el.classList.remove('ck-spring');
  void el.offsetWidth;
  el.classList.add('ck-spring');
  setTimeout(function() { el.classList.remove('ck-spring'); }, 450);
}
function cpop(el, n) {
  if (!el) return;

  var ar  = app.getBoundingClientRect();
  var er  = el.getBoundingClientRect();
  var d   = document.createElement('div'); d.className = 'cpop'; d.textContent = '+'+n+' C';
  d.style.left = (er.left - ar.left + er.width/2 - 16) + 'px';
  d.style.top  = (er.top  - ar.top  - 8) + 'px';
  app.appendChild(d);
  setTimeout(function() { if (d.parentNode) d.remove(); }, 800);
}
function toast(m) {
  var t = document.getElementById('toast'); t.textContent = m; t.classList.add('on');
  setTimeout(function() { t.classList.remove('on'); }, 2200);
}

// ============================================================
// BUNDLE DISINTEGRATION
// ============================================================
function checkDisintegration(bundleId) {
  var bundle = S.tasks.find(function(b) { return b.id === bundleId; });
  if (!bundle) return;
  var remaining = S.tasks.filter(function(t) { return t.parentId === bundleId; });
  if (remaining.length === 0) {
    S.tasks = S.tasks.filter(function(t) { return t.id !== bundleId; });
    recalculateCoins();
  } else if (remaining.length === 1) {
    var sub = remaining[0];
    sub.type     = 'solo';
    sub.parentId = null;
    sub.date     = bundle.date;
    sub.groupId  = bundle.groupId;
    sub.sortOrder = bundle.sortOrder;
    S.tasks = S.tasks.filter(function(t) { return t.id !== bundleId; });
    recalculateCoins();
  }
}

// ============================================================
// MOVE LOGIC
// ============================================================
function moveItem(id, dir) {
  var t = S.tasks.find(function(x) { return x.id === id; });
  if (!t) return;
  var siblings = S.tasks.filter(function(x) {
    return x.groupId === t.groupId && x.type !== 'subtask' && x.parentId === null;
  }).sort(function(a,b){ return a.sortOrder - b.sortOrder; });
  var idx = siblings.indexOf(t);
  var swap = idx + dir;
  if (swap < 0 || swap >= siblings.length) return;
  var tmp = siblings[swap].sortOrder; siblings[swap].sortOrder = t.sortOrder; t.sortOrder = tmp;
  saveState(); render();
}
function moveSubtask(id, dir) {
  var t = S.tasks.find(function(x) { return x.id === id; });
  if (!t || !t.parentId) return;
  var siblings = S.tasks.filter(function(x) { return x.parentId === t.parentId; }).sort(function(a,b){ return a.sortOrder - b.sortOrder; });
  var idx = siblings.indexOf(t);
  var swap = idx + dir;
  if (swap < 0 || swap >= siblings.length) return;
  var tmp = siblings[swap].sortOrder; siblings[swap].sortOrder = t.sortOrder; t.sortOrder = tmp;
  saveState(); render();
}

// ============================================================
// RENDER
// ============================================================
function visibleTasks() {
  var activeDate = S.selDate || tod();
  return S.tasks.filter(function(t) {
    if (t.type === 'subtask') return false;
    if (t.date !== activeDate) return false;
    if (t.type === 'solo' && t.status === 'completed') return false;
    if (t.type === 'bundle') {
      var subs = S.tasks.filter(function(s) { return s.parentId === t.id; });
      if (subs.length > 0 && subs.every(function(s) { return s.status === 'completed'; })) return false;
    }
    return true;
  });
}

function render() {
  var ta = document.getElementById('ta');
  if (!ta) return;
  ta.innerHTML = '';
  renderCal();

  if (S.tab === 'completed') { renderCompletedTab(ta); return; }

  var activeDate = S.selDate || tod();
  var dateHdrEl = document.createElement('div');
  dateHdrEl.className = 'plan-date-hdr';
  var dateObj = new Date(activeDate + 'T12:00:00');
  dateHdrEl.textContent = 'Tasks for: ' + dateObj.toLocaleDateString('en-US', {
    weekday:'long', year:'numeric', month:'long', day:'numeric'
  });
  ta.appendChild(dateHdrEl);

  var vt = visibleTasks();
  if (vt.length === 0) {
    var emptyDiv = document.createElement('div'); emptyDiv.className = 'empty';
    emptyDiv.innerHTML = '<div class="eicon">&#9745;</div><div class="et">No tasks for today</div>'
      + '<div style="font-size:10px;color:var(--color-text-tertiary)">Click &ldquo;+ Add&rdquo; to get started</div>';
    ta.appendChild(emptyDiv); return;
  }

  S.groups.forEach(function(g) {
    var items = vt.filter(function(t) { return t.groupId === g.id; });
    if (items.length === 0) return;
    items.sort(function(a,b){ return a.sortOrder - b.sortOrder; });
    var gc = document.createElement('div'); gc.className = 'gc'; gc.id = 'grp-'+g.id;

    gc.style.background  = g.deleted ? '#F8FAFC' : g.color;
    gc.style.borderColor = g.deleted ? '#B5D4F4' : g.color;

    var isOpen = g._open !== false;
    var gh = document.createElement('div'); gh.className = 'gh' + (isOpen ? ' open' : '');
    var dotEl  = document.createElement('div'); dotEl.className = 'gdot';
    dotEl.style.background = g.deleted ? '#94A3B8' : 'rgba(255,255,255,0.35)';
    var nameEl = document.createElement('span'); nameEl.className = 'gn';
    if (g.deleted) nameEl.style.fontStyle = 'italic';
    nameEl.textContent = g.deleted ? 'Deleted Group' : g.name;
    nameEl.style.color = g.deleted ? 'var(--color-text-tertiary)' : autoContrast(g.color);
    var countEl = document.createElement('span'); countEl.className = 'gm';
    countEl.textContent = items.length;
    countEl.style.color = g.deleted ? 'var(--color-text-tertiary)' : autoContrast(g.color);
    var arrEl = document.createElement('span'); arrEl.className = 'arr' + (isOpen ? ' open' : '');
    arrEl.innerHTML = '&#9660;';
    arrEl.style.color = g.deleted ? 'var(--color-text-tertiary)' : autoContrast(g.color);
    gh.appendChild(dotEl); gh.appendChild(nameEl); gh.appendChild(countEl); gh.appendChild(arrEl);
    gh.onclick = (function(grp){ return function(){ grp._open = !grp._open; render(); }; })(g);
    gc.appendChild(gh);
    var gb = document.createElement('div'); gb.className = 'gb' + (isOpen ? ' open' : '');
    gb.style.background = g.deleted ? '' : 'rgba(255,255,255,0.18)';
    gb.style.padding = '4px 6px 6px';
    if (isOpen) {
      items.forEach(function(t) {
        gb.appendChild(t.type === 'bundle' ? mkBundleCard(t) : mkSoloCard(t));
      });
    }
    gc.appendChild(gb); ta.appendChild(gc);
  });

  var ungrouped = vt.filter(function(t) { return !t.groupId; });
  ungrouped.sort(function(a,b){ return a.sortOrder - b.sortOrder; });
  ungrouped.forEach(function(t) {
    ta.appendChild(t.type === 'bundle' ? mkBundleCard(t) : mkSoloCard(t));
  });
}

// ============================================================
// COMPLETED TAB
// ============================================================
function renderCompletedTab(ta) {
  var filterRow = document.createElement('div');
  filterRow.className = 'comp-filter-row';
  var filterLbl = document.createElement('span');
  filterLbl.className = 'comp-filter-lbl';
  filterLbl.textContent = 'Show:';
  filterRow.appendChild(filterLbl);

  var pillDefs = [
    { val: 'selected', lbl: 'Selected Date' },
    { val: 'all',      lbl: 'All'           },
    { val: 'filter',   lbl: 'Filter'        }
  ];
  pillDefs.forEach(function(p) {
    var pill = document.createElement('span');
    pill.className = 'comp-filter-pill' + (_completedFilter === p.val ? ' on' : '');
    pill.textContent = p.lbl;
    pill.onclick = (function(val) {
      return function() {
        if (_completedFilter === val) return;
        _completedFilter = val;
        render();
      };
    })(p.val);
    filterRow.appendChild(pill);
  });
  ta.appendChild(filterRow);

  if (_completedFilter === 'filter') {
    var rangeRow = document.createElement('div');
    rangeRow.style.cssText = 'display:flex;align-items:center;gap:8px;padding:0 2px;flex-shrink:0';

    var fromLbl = document.createElement('span');
    fromLbl.className = 'comp-filter-lbl';
    fromLbl.textContent = 'From:';
    rangeRow.appendChild(fromLbl);

    var fromInp = document.createElement('input');
    fromInp.type = 'date';
    fromInp.className = 'fi';
    if (_filterDateFrom) fromInp.value = _filterDateFrom;
    fromInp.onchange = function() {
      _filterDateFrom = fromInp.value || null;
      render();
    };
    rangeRow.appendChild(fromInp);

    var toLbl = document.createElement('span');
    toLbl.className = 'comp-filter-lbl';
    toLbl.textContent = 'To:';
    rangeRow.appendChild(toLbl);

    var toInp = document.createElement('input');
    toInp.type = 'date';
    toInp.className = 'fi';
    if (_filterDateTo) toInp.value = _filterDateTo;
    toInp.onchange = function() {
      _filterDateTo = toInp.value || null;
      render();
    };
    rangeRow.appendChild(toInp);

    ta.appendChild(rangeRow);
  }

  var candidates = S.tasks.filter(function(t) {
    if (t.type === 'solo') return t.status === 'completed';
    if (t.type === 'bundle') {
      var subs = S.tasks.filter(function(s) { return s.parentId === t.id; });
      return subs.length > 0 && subs.every(function(s) { return s.status === 'completed'; });
    }
    return false;
  });

  var shown = [];

  if (_completedFilter === 'selected') {
    if (S.selDate === null) {
      var emptyA = document.createElement('div');
      emptyA.className = 'empty';
      emptyA.innerHTML = '<div class="eicon">&#9745;</div><div class="et">Select a date from the calendar to view completed tasks.</div>';
      ta.appendChild(emptyA);
      return;
    }
    shown = candidates.filter(function(t) { return t.date === S.selDate; });

  } else if (_completedFilter === 'all') {
    shown = candidates.slice();

  } else if (_completedFilter === 'filter') {
    if (_filterDateFrom === null || _filterDateTo === null) {
      var emptyB = document.createElement('div');
      emptyB.className = 'empty';
      emptyB.innerHTML = '<div class="eicon">&#9745;</div><div class="et">Select a date range above to view completed tasks.</div>';
      ta.appendChild(emptyB);
      return;
    }
    if (_filterDateFrom > _filterDateTo) {
      var emptyC = document.createElement('div');
      emptyC.className = 'empty';
      emptyC.innerHTML = '<div class="eicon">&#9745;</div><div class="et">\'From\' date must be before \'To\' date.</div>';
      ta.appendChild(emptyC);
      return;
    }
    shown = candidates.filter(function(t) {
      return t.date && t.date >= _filterDateFrom && t.date <= _filterDateTo;
    });
  }

  if (shown.length === 0) {
    var emptyD = document.createElement('div');
    emptyD.className = 'empty';
    var msg = _completedFilter === 'filter' ? 'No completed tasks in this period.' : 'Nothing completed yet';
    emptyD.innerHTML = '<div class="eicon">&#9745;</div><div class="et">' + esc(msg) + '</div>';
    ta.appendChild(emptyD);
    return;
  }

  var dateMap   = {};
  var noDueDate = [];
  shown.forEach(function(t) {
    if (!t.date) { noDueDate.push(t); }
    else {
      if (!dateMap[t.date]) dateMap[t.date] = [];
      dateMap[t.date].push(t);
    }
  });

  var dates = Object.keys(dateMap).sort(function(a, b) { return a > b ? -1 : a < b ? 1 : 0; });
  dates.forEach(function(date) { renderCompletedDateSection(ta, date, dateMap[date]); });
  if (noDueDate.length > 0) { renderCompletedDateSection(ta, null, noDueDate); }
}

function renderCompletedDateSection(ta, date, items) {
  var hdr = document.createElement('div'); hdr.className = 'comp-date-hdr';
  if (date) {
    var d2 = new Date(date + 'T12:00:00');
    hdr.textContent = d2.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
  } else {
    hdr.textContent = 'No Due Date';
  }
  ta.appendChild(hdr);

  var groupedMap = {};
  var ungrouped  = [];
  items.forEach(function(t) {
    if (t.groupId) {
      if (!groupedMap[t.groupId]) groupedMap[t.groupId] = [];
      groupedMap[t.groupId].push(t);
    } else { ungrouped.push(t); }
  });

  var groupIds = Object.keys(groupedMap).sort(function(a, b) { return groupIdx(a) - groupIdx(b); });

  groupIds.forEach(function(gid) {
    var g = S.groups.find(function(x) { return x.id === gid; });
    var gColor = g && !g.deleted ? g.color : '#CBD5E1';
    var gName  = g ? (g.deleted ? 'Deleted Group' : g.name) : 'Unknown Group';
    var gItems = groupedMap[gid].sort(function(a, b) { return (a.sortOrder||0) - (b.sortOrder||0); });

    var gc = document.createElement('div'); gc.className = 'gc'; gc.style.marginBottom = '4px';
    gc.style.background  = g && !g.deleted ? g.color : '#F8FAFC';
    gc.style.borderColor = g && !g.deleted ? g.color : '#B5D4F4';

    var isOpen = true;
    var gh = document.createElement('div'); gh.className = 'gh open';
    var dotEl  = document.createElement('div'); dotEl.className = 'gdot';
    dotEl.style.background = g && !g.deleted ? 'rgba(255,255,255,0.35)' : '#94A3B8';
    var nameEl = document.createElement('span'); nameEl.className = 'gn'; nameEl.textContent = gName;
    nameEl.style.color = g && !g.deleted ? autoContrast(g.color) : 'var(--color-text-tertiary)';
    var countEl = document.createElement('span'); countEl.className = 'gm'; countEl.textContent = gItems.length;
    countEl.style.color = g && !g.deleted ? autoContrast(g.color) : 'var(--color-text-tertiary)';
    var arrEl = document.createElement('span'); arrEl.className = 'arr open'; arrEl.innerHTML = '&#9660;';
    arrEl.style.color = g && !g.deleted ? autoContrast(g.color) : 'var(--color-text-tertiary)';
    gh.appendChild(dotEl); gh.appendChild(nameEl); gh.appendChild(countEl); gh.appendChild(arrEl);

    var gb = document.createElement('div'); gb.className = 'gb open';
    gb.style.background = g && !g.deleted ? 'rgba(255,255,255,0.18)' : '';
    gb.style.padding = '4px 6px 6px';
    gItems.forEach(function(t) { gb.appendChild(t.type === 'bundle' ? mkBundleCard(t) : mkSoloCard(t)); });

    gh.onclick = function() {
      isOpen = !isOpen;
      gh.classList.toggle('open', isOpen);
      arrEl.classList.toggle('open', isOpen);
      gb.classList.toggle('open', isOpen);
      if (isOpen) gh.style.borderRadius = '12px 12px 0 0';
      else gh.style.borderRadius = '';
    };
    gc.appendChild(gh); gc.appendChild(gb);
    ta.appendChild(gc);
  });

  ungrouped.sort(function(a, b) { return (a.sortOrder||0) - (b.sortOrder||0); });
  ungrouped.forEach(function(t) { ta.appendChild(t.type === 'bundle' ? mkBundleCard(t) : mkSoloCard(t)); });
}

// ============================================================
// CARD BUILDERS
// ============================================================
function mkSoloCard(t) {
  var isCompleted = t.status === 'completed';
  var d = document.createElement('div');
  d.className = 'tk' + (isCompleted ? ' done' : '');
  d.id = 'task-' + t.id;
  var dbCls = (t.difficulty && DF[t.difficulty]) ? DF[t.difficulty].cls : '';
  var dbLbl = (t.difficulty && DF[t.difficulty]) ? DF[t.difficulty].lbl : '';
  var tagsHtml = (t.tags || []).map(function(x){ return '<span class="tg2">'+esc(x)+'</span>'; }).join('');
  var dateHtml = t.date ? '<span class="td2">'+fD(t.date)+'</span>' : '';
  var curSt = t.status || 'not-started';
  d.innerHTML =
    '<div class="ck'+(isCompleted?' chk':'')+'" id="ck-'+t.id+'">'+(isCompleted?'&#10003;':'')+'</div>'
    +'<div class="tb">'
    +'<div class="ttl'+(isCompleted?' done':'')+'">'+esc(t.title)+'</div>'
    +'<div class="tm2">'+(dbLbl?'<span class="db '+dbCls+'">'+dbLbl+'</span>':'')+tagsHtml+dateHtml+'</div>'
    +(t.notes?'<div class="tnotes">'+esc(t.notes)+'</div>':'')
    +'</div>'
    +'<div class="tr">'
    +'<div class="spill '+STATUS_CLS[curSt]+'">'+STATUS_LABEL[curSt]+' &#9660;</div>'
    +'<button class="ctx-btn" title="Options">&#8943;</button>'
    +'</div>';
  var tid = t.id;
  var ck  = d.querySelector('.ck');
  ck.onclick = function(e) {
    e.stopPropagation();
    setStatus(tid, t.status === 'completed' ? 'not-started' : 'completed', ck);
  };
  var spill = d.querySelector('.spill');
  spill.onclick = function(e) { e.stopPropagation(); openStatusDrop(tid, spill); };
  var ctxBtn = d.querySelector('.ctx-btn');
  ctxBtn.onclick = function(e) { e.stopPropagation(); openSoloMenu(e, tid); };
  return d;
}

function mkBundleCard(t) {
  var subs  = S.tasks.filter(function(s){ return s.parentId === t.id; }).sort(function(a,b){ return a.sortOrder - b.sortOrder; });
  var total = subs.length;
  var done  = subs.filter(function(s){ return s.status === 'completed'; }).length;
  var pct   = total > 0 ? Math.round(done / total * 100) : 0;
  var isAllDone = done === total && total > 0;
  var bid = t.id;
  var grp      = t.groupId ? S.groups.find(function(g){ return g.id === t.groupId; }) : null;
  var grpColor = grp && !grp.deleted ? grp.color : '#CBD5E1';
  var grpName  = grp ? (grp.deleted ? 'Deleted' : grp.name) : '';

  if (S.tab === 'completed' && t._collapsed === undefined) { t._collapsed = true; }
  var isCollapsed = t._collapsed !== undefined ? t._collapsed : false;

  var d = document.createElement('div'); d.className = 'bundle-card'; d.id = 'bundle-'+t.id;

  var hdr = document.createElement('div'); hdr.className = 'bundle-hdr';
  var tog = document.createElement('span'); tog.className = 'bundle-toggle' + (isCollapsed ? ' closed' : ''); tog.innerHTML = '&#9660;';
  var titleEl = document.createElement('span'); titleEl.className = 'bundle-title'; titleEl.textContent = t.title;
  hdr.appendChild(tog); hdr.appendChild(titleEl);

  if (isCollapsed && S.tab !== 'completed') {
    var inlineCount = document.createElement('span');
    inlineCount.style.cssText = 'font-size:8px;color:var(--color-text-tertiary);margin-left:4px;flex-shrink:0';
    inlineCount.textContent = done+'/'+total+' done';
    hdr.appendChild(inlineCount);
  }
  if (S.tab === 'completed') {
    var clbl = document.createElement('span'); clbl.className = 'bundle-complete-lbl'; clbl.innerHTML = '&#10003; Complete';
    hdr.appendChild(clbl);
  }

  var meta = document.createElement('div'); meta.className = 'bundle-meta';
  if (t.date) { var dbdg = document.createElement('span'); dbdg.className = 'bdg'; dbdg.textContent = fD(t.date); meta.appendChild(dbdg); }
  if (grpName) {
    var gdg = document.createElement('span'); gdg.className = 'bdg';
    var gdot = document.createElement('span'); gdot.className = 'grp-dot'; gdot.style.background = grpColor;
    gdg.appendChild(gdot); gdg.appendChild(document.createTextNode(grpName)); meta.appendChild(gdg);
  }
  var ctxBtn = document.createElement('button'); ctxBtn.className = 'ctx-btn'; ctxBtn.title = 'Options'; ctxBtn.innerHTML = '&#8943;';
  meta.appendChild(ctxBtn); hdr.appendChild(meta); d.appendChild(hdr);

  if (S.tab !== 'completed' && !isCollapsed) {
    var progWrap = document.createElement('div'); progWrap.className = 'bundle-prog-wrap';
    var track = document.createElement('div'); track.className = 'prog-track';
    var fill  = document.createElement('div'); fill.className = 'progress-fill';
    fill.style.width      = pct + '%';
    fill.style.background = isAllDone ? '#22C55E' : '#3B82F6';
    track.appendChild(fill); progWrap.appendChild(track); d.appendChild(progWrap);
    var subCount = document.createElement('div'); subCount.className = 'bundle-sub-count';
    subCount.textContent = done+'/'+total+' done'; d.appendChild(subCount);
  }

  var sw = document.createElement('div'); sw.className = 'subtasks-wrap' + (isCollapsed ? ' hidden' : '');
  if (!isCollapsed) {
    subs.forEach(function(sub) { sw.appendChild(mkSubtaskCard(sub, t)); });
  }
  d.appendChild(sw);

  hdr.onclick = function(e) {
    if (e.target === ctxBtn || ctxBtn.contains(e.target)) return;
    t._collapsed = !t._collapsed; render();
  };
  ctxBtn.onclick = function(e) { e.stopPropagation(); openBundleMenu(e, bid); };
  return d;
}

// ============================================================
// CONTEXT MENU BUILDERS
// ============================================================
function openSoloMenu(e, tid) {
  var t = S.tasks.find(function(x){ return x.id === tid; });
  if (!t) return;

// TASK ACTIONS
// ============================================================
function addToBundleAction(tid, bundleId) {
  var t = S.tasks.find(function(x){ return x.id === tid; });
  var b = S.tasks.find(function(x){ return x.id === bundleId; });
  if (!t || !b) return;
  var subs = S.tasks.filter(function(s){ return s.parentId === bundleId; });
  var maxO = subs.reduce(function(m,s){ return Math.max(m, s.sortOrder||0); }, -1);
  t.type = 'subtask'; t.parentId = bundleId; t.date = null;
  t.groupId = b.groupId; t.sortOrder = maxO + 1;
  saveState(); recalculateCoins(); render(); renderOverdue();
  toast('Task added to bundle');
}

function deleteTask(tid) {
  if (!confirm('Delete this task?')) return;
  S.tasks = S.tasks.filter(function(t){ return t.id !== tid; });
  recalculateCoins(); saveState(); render(); renderCal(); renderOverdue();
}

function removeFromBundle(tid) {
  var t = S.tasks.find(function(x){ return x.id === tid; });
  if (!t || !t.parentId) return;
  var bid    = t.parentId;
  var bundle = S.tasks.find(function(b){ return b.id === bid; });
  t.type = 'solo'; t.parentId = null;
  t.date    = bundle ? bundle.date    : null;
  t.groupId = bundle ? bundle.groupId : null;
  checkDisintegration(bid); saveState(); render(); renderOverdue();
}

function deleteSubtask(tid) {
  if (!confirm('Delete this subtask?')) return;
  var t = S.tasks.find(function(x){ return x.id === tid; });
  if (!t) return;
  var bid = t.parentId;
  S.tasks = S.tasks.filter(function(x){ return x.id !== tid; });
  if (bid) checkDisintegration(bid);
  recalculateCoins(); saveState(); render(); renderOverdue();
}

function completeAll(bid) {
  var bundle = S.tasks.find(function(b){ return b.id === bid; });
  if (!bundle) return;
  var subs = S.tasks.filter(function(s){ return s.parentId === bid; });
  var newlyDone = [];
  subs.forEach(function(s) {
    if (s.status !== 'completed') {
      s.coinsAwarded += DF[s.difficulty] ? DF[s.difficulty].c : 0;
      s.completedAt = tod(); s.status = 'completed'; newlyDone.push(s.id);
    }
  });
  bundle.coinsAwarded += 1; bundle.completedAt = tod();
  recalculateCoins(); saveState();
  onBundleComplete(bid); renderOverdue();
  newlyDone.forEach(function(id) {
    var ck = document.getElementById('ck-'+id);
    if (ck) triggerSpring(ck);
  });
  toast('Bundle completed!');
}

function deleteBundleAll(bid) {
  if (!confirm('Delete bundle and all subtasks?')) return;
  S.tasks = S.tasks.filter(function(t){ return t.id !== bid && t.parentId !== bid; });
  recalculateCoins(); saveState(); render(); renderCal(); renderOverdue();
}

function deleteBundleUnlink(bid) {
  var bundle = S.tasks.find(function(b){ return b.id === bid; });
  if (!bundle) return;
  var subs = S.tasks.filter(function(s){ return s.parentId === bid; }).sort(function(a,b){ return a.sortOrder-b.sortOrder; });
  subs.forEach(function(s, i) {
    s.type = 'solo'; s.parentId = null;
    s.date    = bundle.date;
    s.groupId = bundle.groupId;
    s.sortOrder = bundle.sortOrder + (i+1) * 0.01;
  });
  S.tasks = S.tasks.filter(function(t){ return t.id !== bid; });
  recalculateCoins(); saveState(); render(); renderCal(); renderOverdue();
  toast('Subtasks unlinked');
}

function posModal(id, w) {
  var m   = document.getElementById(id);
  if (!m) return;
  var app = document.getElementById('va');
  var aw  = app.clientWidth;
  var ah  = app.clientHeight;
  var fw  = Math.min(w, aw - 20);
  m.style.width = fw + 'px';
  m.style.left  = Math.max(8, Math.floor((aw - fw) / 2)) + 'px';
  var mh = m.offsetHeight;
  m.style.top   = Math.max(8, Math.floor((ah - mh) / 2)) + 'px';
}

function makeDraggable(id) {
  var m = document.getElementById(id); var hdr = m.querySelector('.mh');
  hdr.onmousedown = function(e) {
    if (e.target.classList.contains('mc') || e.target.id === 'stm-undo' || e.target.id === 'stm-redo') return;
    e.preventDefault();
    var ox=e.clientX-m.offsetLeft, oy=e.clientY-m.offsetTop;
    var app=document.getElementById('va');
    function mm(e2){
      var nl=e2.clientX-ox,nt=e2.clientY-oy,ar=app.getBoundingClientRect();
      nl=Math.max(0,Math.min(nl,ar.width-m.offsetWidth));
      nt=Math.max(0,Math.min(nt,ar.height-m.offsetHeight));
      m.style.left=nl+'px';m.style.top=nt+'px';
    }
    function mu(){ document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu); }
    document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
  };
}
function makeResizable(id) {
  var m=document.getElementById(id);
  var r=document.createElement('div');
  r.style.cssText='position:absolute;bottom:0;right:0;width:12px;height:12px;cursor:se-resize;z-index:10';
  r.innerHTML='<svg width="12" height="12"><path d="M2 10 L10 2 M5 10 L10 5 M8 10 L10 8" stroke="var(--color-border-secondary)" stroke-width="1.2"/></svg>';
  m.style.position='absolute';m.style.overflow='hidden';m.appendChild(r);
  r.onmousedown=function(e){
    e.preventDefault();e.stopPropagation();
    var sx=e.clientX,sy=e.clientY,sw=m.offsetWidth,sh=m.offsetHeight;
    function mm2(e2){
      m.style.width=Math.max(260,sw+e2.clientX-sx)+'px';
      var mb=m.querySelector('.mb');if(mb)mb.style.maxHeight=Math.max(120,sh+e2.clientY-sy-100)+'px';
    }
    function mu2(){ document.removeEventListener('mousemove',mm2);document.removeEventListener('mouseup',mu2); }
    document.addEventListener('mousemove',mm2);document.addEventListener('mouseup',mu2);
  };
}

  if (wasComplete) { bundle.coinsAwarded-=1; bundle.completedAt=null; }
  S.tasks.push({
    id:uid(),type:'subtask',title:title,difficulty:diff,
    tags:tagCtxGet('as').slice(),notes:document.getElementById('asm-notes').value.trim(),
    created:tod(),completedAt:null,date:null,groupId:bundle.groupId,parentId:bid,
    status:'not-started',coinsAwarded:1,sortOrder:maxO3+1
  });
  recalculateCoins();saveState();closeModal('asm');render();renderOverdue();
  toast('Subtask added! +1 coin');
}

// ============================================================
// SETTINGS — WORKING COPY ARCHITECTURE
// ============================================================
function _stmPushUndo() {
  _stmUndo.push({ groups: JSON.parse(JSON.stringify(_stmGroups)), tags: _stmTags.slice() });
  _stmRedo = [];
  _stmRefreshUndoRedo();
}
function _stmDoUndo() {
  if (!_stmUndo.length) return;
  _stmRedo.push({ groups: JSON.parse(JSON.stringify(_stmGroups)), tags: _stmTags.slice() });
  var prev = _stmUndo.pop();
  _stmGroups = prev.groups; _stmTags = prev.tags;
  _stmEditGrpId = null;
  _stmRefreshUndoRedo(); renderSettings();
}
function _stmDoRedo() {
  if (!_stmRedo.length) return;
  _stmUndo.push({ groups: JSON.parse(JSON.stringify(_stmGroups)), tags: _stmTags.slice() });
  var next = _stmRedo.pop();
  _stmGroups = next.groups; _stmTags = next.tags;
  _stmEditGrpId = null;
  _stmRefreshUndoRedo(); renderSettings();
}
function _stmRefreshUndoRedo() {
  var undoBtn = document.getElementById('stm-undo');
  var redoBtn = document.getElementById('stm-redo');
  if (undoBtn) { undoBtn.disabled = _stmUndo.length === 0; undoBtn.style.opacity = _stmUndo.length ? '1' : '0.35'; }
  if (redoBtn) { redoBtn.disabled = _stmRedo.length === 0; redoBtn.style.opacity = _stmRedo.length ? '1' : '0.35'; }
}

function openSettings() {
  _stmGroups   = JSON.parse(JSON.stringify(S.groups));
  _stmTags     = S.tags.slice();
  _stmSnapshot = { groups: JSON.parse(JSON.stringify(S.groups)), tags: S.tags.slice() };
  _stmUndo     = [];
  _stmRedo     = [];
  _stmEditGrpId = null;
  renderSettings();
  openModal('stm');
  posModal('stm', 400);
}

function closeSettingsDiscard() {
  if (_stmSnapshot) {
    S.groups = JSON.parse(JSON.stringify(_stmSnapshot.groups));
    S.groups.forEach(function(g) { if (g._open === undefined) g._open = true; });
    render();
  }
  _stmGroups = null; _stmTags = null; _stmUndo = []; _stmRedo = [];
  _stmEditGrpId = null;
  closeModal('stm');
}

function closeSettingsDone() {
  _stmGroups.forEach(function(g) { if (g._open === undefined) g._open = true; });
  S.groups = _stmGroups;
  S.tags   = _stmTags;
  saveState(); render(); renderCal(); renderOverdue();
  _stmUndo = []; _stmRedo = [];
  _stmEditGrpId = null;
  closeModal('stm');
}

function renderSettings() {
  var body = document.getElementById('stm-body'); if (!body) return;
  body.innerHTML = '';
  _stmRefreshUndoRedo();

  var s1 = document.createElement('div'); s1.className = 'stm-sec';
  var h1 = document.createElement('div'); h1.className = 'stm-sec-hdr';
  var h1Arrow = document.createElement('span'); h1Arrow.style.cssText = 'margin-left:auto;font-size:8px;color:var(--color-text-tertiary)';
  h1Arrow.textContent = _stmSecOpen.groups ? '\u25BC' : '\u25BA';
  h1.innerHTML = '\uD83D\uDC65 Groups ';
  h1.appendChild(h1Arrow);
  h1.onclick = function() { _stmSecOpen.groups = !_stmSecOpen.groups; renderSettings(); };
  s1.appendChild(h1);

  var grpBody = document.createElement('div');
  grpBody.style.display = _stmSecOpen.groups ? 'block' : 'none';

  var gl = document.createElement('div'); gl.id = 'stm-grplist';
  _stmGroups.forEach(function(g, idx) { gl.appendChild(buildGrpRow(g, idx)); });
  grpBody.appendChild(gl);

  var ngSec = document.createElement('div'); ngSec.style.cssText = 'margin-top:8px;border:0.5px solid #E2E8F0;border-radius:6px;padding:8px;background:#F8FAFC';
  var ngSecHdr = document.createElement('div'); ngSecHdr.style.cssText = 'font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--color-text-secondary);margin-bottom:6px';
  ngSecHdr.textContent = 'New Group';
  ngSec.appendChild(ngSecHdr);

  var ngInp = document.createElement('input'); ngInp.type = 'text'; ngInp.className = 'fi';
  ngInp.style.cssText = 'font-size:10px;margin-bottom:6px'; ngInp.placeholder = 'Group name...';
  ngSec.appendChild(ngInp);

  var ngColorRef = { value: '#378ADD' };
  var ngPicker = buildColorPicker('#378ADD', function(col) { ngColorRef.value = col; });
  ngSec.appendChild(ngPicker);

  var ngBtn = document.createElement('button'); ngBtn.className = 'btn btnp';
  ngBtn.style.cssText = 'font-size:10px;width:100%;margin-top:8px'; ngBtn.textContent = '+ Add';
  ngBtn.onclick = function() {
    var n2 = ngInp.value.trim(); if (!n2) return;
    _stmPushUndo();
    var existing = _stmGroups.find(function(g) { return g.name === n2 && g.deleted; });
    if (existing) { existing.deleted = false; }
    else { _stmGroups.push({ id: uid(), name: n2, color: ngColorRef.value, deleted: false, _open: true }); }
    ngInp.value = ''; renderSettings();
  };
  ngSec.appendChild(ngBtn);
  grpBody.appendChild(ngSec);
  s1.appendChild(grpBody);
  body.appendChild(s1);

  var s2 = document.createElement('div'); s2.className = 'stm-sec';
  var h2 = document.createElement('div'); h2.className = 'stm-sec-hdr';
  var h2Arrow = document.createElement('span'); h2Arrow.style.cssText = 'margin-left:auto;font-size:8px;color:var(--color-text-tertiary)';
  h2Arrow.textContent = _stmSecOpen.tags ? '\u25BC' : '\u25BA';
  h2.innerHTML = '\uD83C\uDFF7\uFE0F Tags ';
  h2.appendChild(h2Arrow);
  h2.onclick = function() { _stmSecOpen.tags = !_stmSecOpen.tags; renderSettings(); };
  s2.appendChild(h2);

  var tagBody = document.createElement('div');
  tagBody.style.display = _stmSecOpen.tags ? 'block' : 'none';

  var pillWrap = document.createElement('div'); pillWrap.className = 'stm-tag-wrap';
  var sortedTags = _stmTags.slice().sort(function(a, b) { return a.toLowerCase().localeCompare(b.toLowerCase()); });
  sortedTags.forEach(function(tag) {
    var pill = document.createElement('div'); pill.className = 'stm-tag-pill';
    pill.textContent = tag;
    var delBtn = document.createElement('span'); delBtn.className = 'stm-tag-del'; delBtn.textContent = '\u00D7';
    delBtn.onclick = function(e) {
      e.stopPropagation();
      _stmPushUndo();
      var idx = _stmTags.indexOf(tag);
      if (idx >= 0) _stmTags.splice(idx, 1);
      renderSettings();
    };
    pill.appendChild(delBtn);
    pillWrap.appendChild(pill);
  });
  tagBody.appendChild(pillWrap);

  var tagAddInp = document.createElement('input'); tagAddInp.type = 'text'; tagAddInp.className = 'fi';
  tagAddInp.style.cssText = 'width:100%;margin-top:6px;font-size:10px';
  tagAddInp.placeholder = 'Add a tag and press Enter\u2026';
  var tagErrEl = document.createElement('div'); tagErrEl.style.cssText = 'color:#B91C1C;font-size:9px;min-height:14px';
  tagAddInp.onkeydown = function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      var v = tagAddInp.value.trim(); if (!v) return;
      if (_stmTags.indexOf(v) >= 0) {
        tagErrEl.textContent = 'Tag already exists';
        tagAddInp.style.borderColor = '#EF4444';
        setTimeout(function() { tagAddInp.style.borderColor = ''; tagErrEl.textContent = ''; }, 1200);
        return;
      }
      _stmPushUndo();
      _stmTags.push(v);
      tagAddInp.value = '';
      tagErrEl.textContent = '';
      renderSettings();
    }
  };
  tagBody.appendChild(tagAddInp);
  tagBody.appendChild(tagErrEl);
  s2.appendChild(tagBody);
  body.appendChild(s2);

  var s3 = document.createElement('div'); s3.className = 'stm-sec';
  var h3 = document.createElement('div'); h3.className = 'stm-sec-hdr';
  var h3Arrow = document.createElement('span'); h3Arrow.style.cssText = 'margin-left:auto;font-size:8px;color:var(--color-text-tertiary)';
  h3Arrow.textContent = _stmSecOpen.appearance ? '\u25BC' : '\u25BA';
  h3.innerHTML = '\uD83C\uDF19 Appearance ';
  h3.appendChild(h3Arrow);
  h3.onclick = function() { _stmSecOpen.appearance = !_stmSecOpen.appearance; renderSettings(); };
  s3.appendChild(h3);
  var appBody = document.createElement('div'); appBody.style.display = _stmSecOpen.appearance ? 'block' : 'none';
  appBody.innerHTML = '<div style="font-size:10px;color:var(--color-text-secondary);padding:5px 0">'
    + 'Dark mode \u2014 coming in a future update'
    + '<div style="margin-top:6px;display:flex;align-items:center;gap:6px">'
    + '<span style="font-size:10px">Dark mode</span>'
    + '<div style="width:30px;height:16px;border-radius:8px;background:#D1D5DB;cursor:not-allowed;opacity:.5"></div>'
    + '</div></div>';
  s3.appendChild(appBody);
  body.appendChild(s3);
}

function buildGrpRow(g, idx) {
  var isEditing = (_stmEditGrpId === g.id);
  var wrapper = document.createElement('div');

  var row = document.createElement('div'); row.className = 'stm-row'; row.id = 'stm-grp-' + g.id;
  var dotEl = document.createElement('div'); dotEl.className = 'gdot';
  dotEl.style.cssText = 'width:12px;height:12px;flex-shrink:0;background:' + (g.deleted ? '#CBD5E1' : g.color);
  var nameEl = document.createElement('span'); nameEl.className = 'stm-lbl' + (g.deleted ? ' del' : '');
  nameEl.textContent = g.name + (g.deleted ? ' (deleted)' : '');
  var pencilBtn = document.createElement('button'); pencilBtn.className = 'stm-ib';
  pencilBtn.style.fontSize = '11px'; pencilBtn.title = 'Edit group';
  pencilBtn.textContent = '\u270F\uFE0F';
  pencilBtn.onclick = function() {
    _stmEditGrpId = isEditing ? null : g.id;
    renderSettings();
  };
  row.appendChild(dotEl); row.appendChild(nameEl); row.appendChild(pencilBtn);
  wrapper.appendChild(row);

  if (isEditing) {
    var accordion = document.createElement('div');
    accordion.style.cssText = 'border:0.5px solid #B5D4F4;border-radius:6px;padding:8px;margin:3px 0 5px;background:#F8FAFC;display:flex;flex-direction:column;gap:8px';

    var renLbl = document.createElement('label'); renLbl.className = 'fl'; renLbl.textContent = 'Name';
    var renInp = document.createElement('input'); renInp.type = 'text'; renInp.className = 'fi';
    renInp.style.fontSize = '10px'; renInp.value = g.name;
    renInp.onchange = function() {
      var v = renInp.value.trim(); if (!v) return;
      _stmPushUndo();
      g.name = v;
      renderSettings();
    };
    var renWrap = document.createElement('div'); renWrap.appendChild(renLbl); renWrap.appendChild(renInp);
    accordion.appendChild(renWrap);

    var colLbl = document.createElement('label'); colLbl.className = 'fl'; colLbl.textContent = 'Color';
    accordion.appendChild(colLbl);
    var picker = buildColorPicker(g.color, function(col) {
      g.color = col;
      dotEl.style.background = col;
      var liveG = S.groups.find(function(x) { return x.id === g.id; });
      if (liveG) { liveG.color = col; render(); }
    });
    accordion.appendChild(picker);

    if (!g.deleted) {
      var moveRow = document.createElement('div'); moveRow.style.cssText = 'display:flex;gap:5px';
      var upBtn = document.createElement('button'); upBtn.className = 'stm-ib'; upBtn.textContent = '\u25B2 Move Up';
      upBtn.onclick = function() { moveGrpInSettings(g.id, -1); };
      var dnBtn = document.createElement('button'); dnBtn.className = 'stm-ib'; dnBtn.textContent = '\u25BC Move Down';
      dnBtn.onclick = function() { moveGrpInSettings(g.id, 1); };
      moveRow.appendChild(upBtn); moveRow.appendChild(dnBtn);
      accordion.appendChild(moveRow);
    }

    var actionRow = document.createElement('div'); actionRow.style.cssText = 'display:flex;gap:5px;justify-content:space-between';
    if (g.deleted) {
      var restBtn = document.createElement('button'); restBtn.className = 'stm-ib restore'; restBtn.textContent = 'Restore';
      restBtn.onclick = function() { _stmPushUndo(); g.deleted = false; renderSettings(); };
      actionRow.appendChild(restBtn);
    } else {
      var delBtn = document.createElement('button'); delBtn.className = 'stm-ib danger'; delBtn.textContent = 'Delete Group';
      delBtn.onclick = function() {
        if (!confirm('Delete group? Tasks retain their group ID.')) return;
        _stmPushUndo(); g.deleted = true; _stmEditGrpId = null; renderSettings();
      };
      actionRow.appendChild(delBtn);
    }
    var doneEditBtn = document.createElement('button'); doneEditBtn.className = 'stm-ib';
    doneEditBtn.textContent = '\u2715 Close';
    doneEditBtn.onclick = function() { _stmEditGrpId = null; renderSettings(); };
    actionRow.appendChild(doneEditBtn);
    accordion.appendChild(actionRow);
    wrapper.appendChild(accordion);
  }

  return wrapper;
}

function moveGrpInSettings(gid, dir) {
  var idx = -1;
  for (var i = 0; i < _stmGroups.length; i++) { if (_stmGroups[i].id === gid) { idx = i; break; } }
  var swap = idx + dir;
  if (idx < 0 || swap < 0 || swap >= _stmGroups.length) return;
  _stmPushUndo();
  var tmp = _stmGroups[idx]; _stmGroups[idx] = _stmGroups[swap]; _stmGroups[swap] = tmp;
  renderSettings();
}

// ============================================================
// TABS + SPLIT BUTTON
// ============================================================
function setTab(t) {
  S.tab = t;
  if (t === 'completed') {
    _completedFilter = 'selected';
    _filterDateFrom  = null;
    _filterDateTo    = null;
  }
  if (t === 'main') {
    _filterDateFrom  = null;
    _filterDateTo    = null;
  }
  document.getElementById('tab-main').className      = 'tab' + (t === 'main' ? ' on' : '');
  document.getElementById('tab-completed').className = 'tab' + (t === 'completed' ? ' on' : '');
  render(); renderCal();
}

function toggleAddDrop(btn) {
  var drop = document.getElementById('addDrop');
  if (drop.classList.contains('on')) { drop.classList.remove('on'); return; }
  var va=document.getElementById('va'); var vr=va.getBoundingClientRect(); var br=btn.getBoundingClientRect();
  drop.style.top  = (br.bottom-vr.top+2)+'px';
  drop.style.left = (br.right -vr.left-130)+'px';
  drop.classList.add('on');
  setTimeout(function(){
    var dismiss=function(e){ if(!drop.contains(e.target)&&e.target!==btn){drop.classList.remove('on');document.removeEventListener('mousedown',dismiss);} };
    document.addEventListener('mousedown',dismiss);
  },0);
}
function hideAddDrop() { var d=document.getElementById('addDrop'); if(d) d.classList.remove('on'); }

// ============================================================
// KEYBOARD SHORTCUTS
// ============================================================
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey||e.metaKey) && e.key==='n') { e.preventDefault(); openAddTask(null); }
  if (e.key==='Escape') { closeAll(); }
});

// ============================================================
// INIT
// ============================================================
['tm','bm','ebm','asm','stm'].forEach(function(id){
  makeDraggable(id);
  if (id !== 'bm' && id !== 'stm') makeResizable(id);
});

loadState();
seedDemo();
render();
renderCal();
renderOverdue();
</script>
